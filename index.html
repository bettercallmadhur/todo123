<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeXP</title>
<style>
:root{--forest:#173B16;--olive:#456B19;--sage:#A6B99A;--light:#C9D4BC;--pink:#F4C3C5;--cream:#F3E9D3;--text:#26351F}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Poppins','Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;background:linear-gradient(120deg,#F4C3C5 0%,#D9A08C 22%,#8FA47A 48%,#456B19 72%,#C7C97E 100%);background-attachment:fixed}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh;padding:18px;gap:18px}
.side{background:linear-gradient(180deg,#8FA47A 0%,#456B19 35%,#173B16 100%);border-radius:30px;padding:30px 24px;color:#fff;display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 50px rgba(23,59,22,.35)}
.hello{font-size:24px;font-weight:300;line-height:1.2;color:var(--forest)}
.hello b{display:block;font-size:34px;font-weight:700;color:var(--forest)}
.pill{background:var(--pink);color:var(--forest);border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 18px rgba(0,0,0,.15);text-align:center}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.pill.sm{padding:6px 14px;font-size:13px;box-shadow:none}
.pill:disabled{opacity:.4;cursor:default;transform:none}
.nav{display:flex;flex-direction:column}
.nav button{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.22);color:#E8EDDD;text-align:left;padding:14px 4px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:color .2s,padding .2s}
.nav button:hover{color:#fff;padding-left:10px}
.nav button.on{color:#fff;font-weight:600}
.nav button.on::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--pink);margin-left:auto}
.quote{margin-top:auto;background:rgba(244,195,197,.9);color:var(--forest);border-radius:20px;padding:16px 16px 14px;font-style:italic;font-size:13px;line-height:1.5;position:relative}
.quote .by{text-align:right;font-style:normal;font-size:11px;font-weight:600;margin-top:4px}
.main{padding:14px 18px 30px;overflow:hidden}
h1{font-size:30px;font-weight:700;color:#FFF7E6;text-shadow:0 2px 12px rgba(23,59,22,.35);margin-bottom:18px}
.glass{background:linear-gradient(160deg,rgba(201,212,188,.55),rgba(166,185,154,.4));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.45);border-radius:26px;padding:20px;box-shadow:0 12px 34px rgba(23,59,22,.18);color:var(--forest);transition:transform .25s}
.glass:hover{transform:translateY(-2px)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
h2{font-size:20px;font-weight:600;color:var(--forest)}
.link{background:none;border:0;color:var(--forest);font-size:13px;cursor:pointer;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.todo{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.28);border-radius:18px;padding:12px 16px;margin-bottom:12px;transition:transform .2s}
.todo:hover{transform:translateX(4px)}
.tile{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.todo .nm{font-weight:600;font-size:15px}
.todo .pr{font-size:12px;opacity:.75}
.todo.done .nm{text-decoration:line-through;opacity:.6}
.todo .grow{flex:1;min-width:0}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--forest);background:rgba(255,255,255,.6);cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0;transition:background .3s,transform .2s}
.box:hover{transform:scale(1.1)}
.box.on{background:var(--forest);animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.arrows{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.cbtn{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.5);color:var(--forest);cursor:pointer;display:grid;place-items:center;font-size:15px}
.cbtn.p{background:var(--pink)}
.cbtn:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:18px;font-size:15px}
.tabs button{background:none;border:0;color:var(--forest);opacity:.6;cursor:pointer;padding:4px 0;font-size:15px}
.tabs button.on{opacity:1;font-weight:600;text-decoration:underline;text-underline-offset:6px}
.hab{display:grid;grid-template-columns:150px repeat(7,1fr);gap:8px;align-items:center;font-size:13px}
.hab .lbl{font-size:13px;line-height:1.25}
.hab .hd{text-align:center;font-weight:600;opacity:.75}
.sq{height:24px;border-radius:7px;background:rgba(255,255,255,.55)}
.sq.on{background:var(--forest)}
.sq.fut{opacity:.4}
.donut{position:relative;width:150px;height:150px;flex-shrink:0}
.donut svg{transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--forest)}
.prog{display:flex;gap:20px;align-items:center}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px 10px}
.stats span{font-size:13px;opacity:.85}
.stats b{display:block;font-size:26px;color:var(--forest)}
.stats small{font-size:13px;font-weight:400}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;text-align:center}
.av{width:68px;height:68px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle,#fff,#F4C3C5);box-shadow:0 6px 16px rgba(23,59,22,.2);transition:transform .25s}
.badges div:hover .av{transform:scale(1.08) rotate(-4deg)}
.badges .lbl{font-size:13px;margin-top:6px;font-weight:500}
.badges .lock .av{filter:grayscale(1);opacity:.45}
.badges .lock .lbl{opacity:.6}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:18px;color:var(--forest)}
.landing h1{font-size:clamp(34px,6vw,58px);line-height:1.1;max-width:720px;color:var(--forest);text-shadow:none}
.landing p{max-width:520px;font-size:17px;opacity:.9}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.ch{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.form label{font-size:12px;font-weight:600;display:block;margin-bottom:4px}
input,select{width:100%;padding:10px 14px;border-radius:14px;border:1px solid rgba(69,107,25,.3);background:rgba(255,255,255,.85);color:var(--text)}
.bar{height:10px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--forest));transition:width .6s ease}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px}
.chart div{flex:1;background:linear-gradient(180deg,#F4C3C5,#456B19);border-radius:10px 10px 4px 4px;min-height:4px;transition:height .6s;position:relative}
.toast{position:fixed;bottom:24px;right:24px;background:var(--forest);color:var(--cream);padding:14px 20px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;z-index:50;animation:up .4s ease;max-width:320px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.grid,.grid2{grid-template-columns:1fr}.hab{grid-template-columns:110px repeat(7,1fr)}}
@media(max-width:820px){
.app{grid-template-columns:1fr;padding:10px;gap:12px}
.side{padding:18px;gap:12px;border-radius:22px}
.hello b{font-size:26px}
.nav{flex-direction:row;overflow-x:auto;gap:4px}
.nav button{white-space:nowrap;padding:8px 12px;border-bottom:0}
.quote{display:none}
.form{grid-template-columns:1fr 1fr}
.hab{grid-template-columns:90px repeat(7,1fr);font-size:11px}
h1{font-size:24px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY='lifexp-v1';
const LEVELS=[[0,'Beginner'],[100,'Explorer'],[300,'Consistent'],[600,'Achiever'],[1000,'Champion'],[1500,'Legend']];
const ICON={Health:'💧',Fitness:'🏃',Learning:'📖',Productivity:'⚡',Mindfulness:'🧘',Lifestyle:'🌿'};
const CATS=Object.keys(ICON);
const CHALLENGES=[
{id:'water',t:'Drink 2 litres of water',i:'💧'},{id:'read',t:'Read 10 pages',i:'📖'},
{id:'exercise',t:'Exercise for 20 minutes',i:'🏃'},{id:'early',t:'Wake up early',i:'🌅'},
{id:'social',t:'Avoid social media for one hour',i:'📵'},{id:'learn',t:'Learn something new',i:'🧠'}];
const QUOTES=['Every tiny step counts — today’s habit is tomorrow’s victory.','Small wins build big changes.'];

function dk(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function addDays(n,base){const d=new Date(base||Date.now());d.setDate(d.getDate()+n);return d;}
const TODAY=()=>dk(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S=load()||{name:'Richard',started:false,nextId:5,xp:0,log:{},ch:[],bonus:{},awarded:{},
habits:[
{id:1,n:'Drink water',c:'Health',f:'Daily',r:'08:00',g:'1/2 liters'},
{id:2,n:'Read a book',c:'Learning',f:'Daily',r:'21:00',g:'0/30 min'},
{id:3,n:'Morning workout / stretching',c:'Fitness',f:'Daily',r:'07:00',g:'1/1'},
{id:4,n:'Meditate',c:'Mindfulness',f:'Daily',r:'06:30',g:'20/20 min'}]};
let V={view:'dashboard',week:0,range:7};

function doneCount(k){return S.log[k]?Object.keys(S.log[k]).length:0}
function isDone(id,k){return !!(S.log[k]&&S.log[k][id])}
function total(){return Object.values(S.log).reduce((a,d)=>a+Object.keys(d).length,0)}
function level(){let i=0;LEVELS.forEach((l,j)=>{if(S.xp>=l[0])i=j});const nx=LEVELS[i+1];return{i,n:LEVELS[i][1],min:LEVELS[i][0],next:nx?nx[0]:null}}
function allDone(k){return S.habits.length>0&&S.habits.every(h=>isDone(h.id,k))}
function streakOf(){let n=0;const d=new Date();if(!doneCount(dk(d)))d.setDate(d.getDate()-1);while(doneCount(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function maxStreak(){const ks=Object.keys(S.log).filter(doneCount).sort();let best=0,cur=0,prev=null;for(const k of ks){const d=new Date(k+'T12:00');cur=prev&&(d-prev)/864e5===1?cur+1:1;prev=d;best=Math.max(best,cur)}return best}
function perfectDays(){return Object.keys(S.log).filter(allDone).length}

const BADGES=[
{n:'Starter win',i:'🐼',d:'Complete your first habit',ok:()=>total()>=1},
{n:'One week hero',i:'🥋',d:'7-day streak',ok:()=>maxStreak()>=7},
{n:'Monthly master',i:'🎓',d:'30-day streak',ok:()=>maxStreak()>=30},
{n:'Book reader',i:'📚',d:'Finish the reading challenge',ok:()=>S.ch.some(x=>x.endsWith('|read'))},
{n:'Fitness champion',i:'🏆',d:'Finish the exercise challenge',ok:()=>S.ch.some(x=>x.endsWith('|exercise'))},
{n:'Consistency king',i:'💎',d:'5 perfect days',ok:()=>perfectDays()>=5}];

const panda=(w=120,happy=true)=>`<svg class="float" width="${w}" viewBox="0 0 120 120" aria-hidden="true"><circle cx="30" cy="30" r="14" fill="#26351F"/><circle cx="90" cy="30" r="14" fill="#26351F"/><circle cx="60" cy="62" r="42" fill="#fff"/><ellipse cx="42" cy="58" rx="12" ry="14" fill="#26351F" transform="rotate(-20 42 58)"/><ellipse cx="78" cy="58" rx="12" ry="14" fill="#26351F" transform="rotate(20 78 58)"/><circle cx="43" cy="58" r="4" fill="#fff"/><circle cx="77" cy="58" r="4" fill="#fff"/><circle cx="43" cy="58" r="2" fill="#173B16"/><circle cx="77" cy="58" r="2" fill="#173B16"/><ellipse cx="60" cy="74" rx="4" ry="3" fill="#26351F"/><path d="${happy?'M52 82 Q60 92 68 82':'M52 86 Q60 78 68 86'}" stroke="#26351F" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="36" cy="78" r="6" fill="#F4C3C5"/><circle cx="84" cy="78" r="6" fill="#F4C3C5"/></svg>`;

function flash(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function toggle(id){
const k=TODAY();S.log[k]=S.log[k]||{};
if(S.log[k][id]){delete S.log[k][id];if(!doneCount(k))delete S.log[k];S.xp=Math.max(0,S.xp-10);}
else{
const before=level().i;S.log[k][id]=1;S.xp+=10;flash('+10 XP');
if(allDone(k)&&!S.bonus[k]){S.bonus[k]=1;S.xp+=50;flash('+50 XP perfect day! 🐼')}
const st=streakOf();
[[7,'s7',100],[30,'s30',500]].forEach(([n,key,x])=>{if(st>=n&&!S.awarded[key]){S.awarded[key]=1;S.xp+=x;flash('+'+x+' XP: '+n+'-day streak! 🔥')}});
if(level().i>before)flash('Level up! You are now '+level().n+' 🎉');
}
save();
}
function chToggle(id){
const k=TODAY(),key=k+'|'+id;
if(S.ch.includes(key)){S.ch=S.ch.filter(x=>x!==key);S.xp=Math.max(0,S.xp-25)}
else{const before=level().i;S.ch.push(key);S.xp+=25;flash('+25 XP challenge complete!');if(level().i>before)flash('Level up! 🎉')}
save();
}

function levelBar(){const L=level();const pct=L.next?((S.xp-L.min)/(L.next-L.min))*100:100;
return `<div class="glass" style="margin-top:20px"><div class="head"><h2>XP & Level</h2><span>Lv ${L.i+1} · ${L.n}</span></div><div class="bar"><i style="width:${pct}%"></i></div><p style="margin-top:8px;font-size:13px">${S.xp} XP · ${L.next?(L.next-S.xp)+' XP to '+LEVELS[L.i+1][1]:'Max level reached!'}</p></div>`}

function viewDashboard(){
const k=TODAY(),tot=S.habits.length,done=doneCount(k);
const rng=V.range;let rt=0,rp=0;
for(let i=0;i<rng;i++){const key=dk(addDays(-i));rt+=doneCount(key);if(allDone(key))rp++}
const pct=tot&&rng?Math.round(rt/(tot*rng)*100):0,C=2*Math.PI*56;
const base=addDays(V.week*7);const first=addDays(-6,base),last=addDays(0,base);
const f=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'.');
const days=[];for(let j=6;j>=0;j--)days.push(addDays(-j,base));
const DL=['M','T','W','T','F','S','S'];
return `<h1>Dashboard</h1>
<div class="grid">
<div>
<div class="head" style="margin-bottom:8px"><h2 style="color:#FFF7E6">Today's TODOs</h2><button class="link">see all →</button></div>
${S.habits.map(h=>{const on=isDone(h.id,k);return `<div class="todo ${on?'done':''}"><div class="tile">${ICON[h.c]||'✨'}</div><div class="grow"><div class="nm">${esc(h.n)}</div><div class="pr">${on?'1/1':'0/1'} · ${esc(h.g||'Daily')}</div></div><button class="box ${on?'on':''}" data-act="toggle" data-id="${h.id}" aria-label="Complete habit">${on?'✓':''}</button></div>`}).join('') || '<p>No habits yet. Add one to start!</p>'}
<div class="arrows"><button class="cbtn" data-act="view" data-v="challenges" title="Challenges">→</button></div>
</div>
<div class="glass">
<div class="tabs" style="margin-bottom:14px">${[[7,'Weekly'],[30,'Monthly'],[365,'Yearly']].map(([v,l])=>`<button class="${V.range===v?'on':''}" data-act="range" data-v="${v}">${l}</button>`).join('')}</div>
<div class="head"><span>${f(first)} – ${f(last)}</span><div style="display:flex;gap:8px"><button class="cbtn" data-act="week" data-d="-1">←</button><button class="cbtn p" data-act="week" data-d="1" ${V.week>=0?'disabled':''}>→</button></div></div>
<div class="hab" style="margin-top:14px"><div></div>${DL.map(x=>`<div class="hd">${x}</div>`).join('')}
${S.habits.map(h=>`<div class="lbl">${esc(h.n)}</div>${days.map(d=>{const key=dk(d),fut=key>k;return `<div class="sq ${!fut&&isDone(h.id,key)?'on':''} ${fut?'fut':''}"></div>`}).join('')}`).join('')}
</div></div>
</div>
<div class="grid2" style="grid-template-columns:1fr 1fr">
<div class="glass"><div class="tabs" style="margin-bottom:14px">${[[7,'Weekly'],[30,'Monthly'],[365,'Yearly']].map(([v,l])=>`<button class="${V.range===v?'on':''}" data-act="range" data-v="${v}">${l}</button>`).join('')}</div>
<div class="prog"><div class="donut"><svg width="150" height="150"><circle cx="75" cy="75" r="56" stroke="rgba(255,255,255,.55)" stroke-width="16" fill="none"/><circle cx="75" cy="75" r="56" stroke="#173B16" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" style="transition:stroke-dashoffset .8s"/></svg><div class="c">${pct}%</div></div>
<div class="stats"><div><span>Current Streak</span><b>${streakOf()} <small>days</small></b></div><div><span>Perfect days</span><b>${rp}</b></div><div><span>Habits done</span><b>${rt}</b></div><div><span>Daily average</span><b>${(rt/rng).toFixed(1)} <small>habits</small></b></div></div></div>
</div>
<div class="glass"><div class="head"><h2>Rewards</h2><button class="link" data-act="view" data-v="rewards">see all →</button></div>
<div class="badges">${BADGES.map(b=>{const ok=b.ok();return `<div class="${ok?'':'lock'}"><div class="av">${b.i}</div><div class="lbl">${b.n}</div></div>`}).join('')}</div></div>
</div>
${levelBar()}`;
}

function viewHabits(){
const k=TODAY();
return `<h1>My Habits</h1>
<div class="glass" style="margin-bottom:20px"><h2 style="margin-bottom:12px">Create a habit</h2>
<form id="hf" class="form"><div><label>Name</label><input name="n" required placeholder="e.g. Journal"></div>
<div><label>Category</label><select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
<div><label>Frequency</label><select name="f"><option>Daily</option><option>Weekly</option><option>Custom</option></select></div>
<div><label>Reminder</label><input type="time" name="r" value="09:00"></div>
<div><label>Goal</label><input name="g" placeholder="e.g. 10 min"></div>
<button class="pill" type="submit">Add</button></form></div>
<div class="glass">${S.habits.length?S.habits.map(h=>{const dots=[];for(let i=13;i>=0;i--){const key=dk(addDays(-i));dots.push(`<div class="sq ${isDone(h.id,key)?'on':''}" style="height:12px;width:12px;border-radius:4px" title="${key}"></div>`)}
return `<div class="todo"><div class="tile">${ICON[h.c]||'✨'}</div><div class="grow"><div class="nm">${esc(h.n)}</div><div class="pr">${esc(h.c)} · ${esc(h.f)} · ⏰ ${esc(h.r||'—')} · goal: ${esc(h.g||'—')}</div><div style="display:flex;gap:4px;margin-top:8px">${dots.join('')}</div></div><button class="pill sm" data-act="edit" data-id="${h.id}">Edit</button>&nbsp;<button class="pill sm" data-act="del" data-id="${h.id}">Delete</button></div>`}).join(''):'<p>No habits yet.</p>'}
<p style="font-size:13px;margin-top:8px">Today: ${doneCount(k)} of ${S.habits.length} done. Dots show the last 14 days.</p></div>`;
}

function viewChallenges(){
const k=TODAY();
return `<h1>Daily Challenges</h1><p style="color:#FFF7E6;margin:-10px 0 18px">Complete a challenge for +25 XP. Resets each day.</p>
<div class="cards">${CHALLENGES.map(c=>{const on=S.ch.includes(k+'|'+c.id);return `<div class="glass ch"><div class="tile">${c.i}</div><b style="font-size:16px">${c.t}</b><button class="${on?'pill':'pill'}" data-act="ch" data-id="${c.id}" ${on?'style="opacity:.7"':''}>${on?'Completed ✓':'Complete · +25 XP'}</button></div>`}).join('')}</div>`;
}

function viewRewards(){
const L=level();
return `<h1>Rewards & Achievements</h1>
<div class="glass" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px">${panda(90,BADGES.some(b=>b.ok()))}<div style="flex:1;min-width:200px"><h2>Level ${L.i+1}: ${L.n}</h2><div class="bar" style="margin:10px 0"><i style="width:${L.next?((S.xp-L.min)/(L.next-L.min))*100:100}%"></i></div><p style="font-size:13px">${S.xp} XP${L.next?' · next: '+LEVELS[L.i+1][1]+' at '+L.next+' XP':''}</p></div></div>
<div class="glass" style="margin-bottom:20px"><h2 style="margin-bottom:14px">Achievements</h2><div class="badges" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${BADGES.map(b=>{const ok=b.ok();return `<div class="${ok?'':'lock'}"><div class="av">${b.i}</div><div class="lbl">${b.n}</div><div style="font-size:12px">${ok?'✓ Unlocked':'🔒 '+b.d}</div></div>`}).join('')}</div></div>
<div class="glass"><h2>Level progression</h2><p style="font-size:14px;margin-top:8px">${LEVELS.map((l,j)=>(j===L.i?'<b>':'')+'Lv '+(j+1)+' · '+l[1]+' ('+l[0]+' XP)'+(j===L.i?'</b>':'')).join(' · ')}</p>
<p style="font-size:13px;margin-top:10px">Habit +10 · Perfect day +50 · Challenge +25 · 7-day streak +100 · 30-day streak +500</p></div>`;
}

function viewAnalytics(){
const bars=[];for(let i=13;i>=0;i--){const key=dk(addDays(-i));const r=S.habits.length?doneCount(key)/S.habits.length:0;bars.push(`<div style="height:${Math.max(r*100,3)}%" title="${Math.round(r*100)}%"></div>`)}
let month=0;for(let i=0;i<30;i++)month+=doneCount(dk(addDays(-i)));
return `<h1>Analytics</h1>
<div class="cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
<div class="glass"><span>Longest streak</span><div style="font-size:30px;font-weight:700">🔥 ${maxStreak()} days</div></div>
<div class="glass"><span>Total completed habits</span><div style="font-size:30px;font-weight:700">${total()}</div></div>
<div class="glass"><span>Last 30 days</span><div style="font-size:30px;font-weight:700">${month} done</div></div></div>
<div class="glass"><h2 style="margin-bottom:14px">Daily completion rate · last 14 days</h2><div class="chart">${bars.join('')}</div></div>
<div class="glass" style="margin-top:20px"><h2>XP earned</h2><p style="margin-top:8px">Current total: <b>${S.xp} XP</b>.</p></div>`;
}

function viewSettings(){
return `<h1>Settings</h1>
<div class="glass" style="max-width:560px"><h2 style="margin-bottom:12px">Profile</h2>
<form id="nf" style="display:flex;flex-direction:column;gap:12px"><div><label style="font-size:13px">Username</label><input name="name" value="${esc(S.name)}" required></div><div><button class="pill" type="submit">Save changes</button></div></form></div>
<div class="glass" style="max-width:560px;margin-top:20px"><h2 style="margin-bottom:8px">Account & data</h2><p style="font-size:14px;margin-bottom:12px">Your data is saved in this browser. Resetting erases all habits, XP, and badges.</p><button class="pill" data-act="reset">Reset all data</button></div>`;
}

function landing(){return `<div class="landing">${panda(170)}
<h1>Your Life. Your Habits. Your Level Up.</h1>
<p>Turn your everyday life into a game. Build habits, complete daily challenges, earn XP, maintain streaks, unlock achievements, and level up your life.</p>
<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="pill" data-act="start">Start Your Journey</button><button class="pill" data-act="start" style="background:rgba(255,255,255,.5)">Explore Features</button></div>
<p style="font-size:14px">Level Up Your Life, One Habit at a Time.</p></div>`}

const VIEWS={dashboard:viewDashboard,habits:viewHabits,challenges:viewChallenges,rewards:viewRewards,analytics:viewAnalytics,settings:viewSettings};
const NAV=[['dashboard','Dashboard'],['habits','My habits'],['challenges','Daily challenges'],['rewards','Rewards'],['analytics','Analytics'],['settings','Settings']];

function render(){
if(!S.started){document.getElementById('root').innerHTML=landing();return}
const q=QUOTES[new Date().getDate()%QUOTES.length];
document.getElementById('root').innerHTML=`<div class="app"><aside class="side">
<div class="hello">Hello,<b>${esc(S.name)}</b></div>
<button class="pill" data-act="view" data-v="habits">Add new habit</button>
<nav class="nav">${NAV.map(([v,l])=>`<button class="${V.view===v?'on':''}" data-act="view" data-v="${v}">${l}</button>`).join('')}</nav>
<div class="quote">“${q}”${''}<div class="by">Habby</div></div>
</aside><main class="main">${VIEWS[V.view]()}</main></div>`;
}

document.addEventListener('click',e=>{
const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
const a=t.dataset.act,id=t.dataset.id;
switch(a){
case'start':S.started=true;save();break;
case'view':V.view=t.dataset.v;break;
case'toggle':toggle(+id);break;
case'ch':chToggle(id);break;
case'week':V.week=Math.min(0,V.week+(+t.dataset.d));break;
case'range':V.range=+t.dataset.v;break;
case'edit':{const h=S.habits.find(x=>x.id==id);const n=prompt('Rename habit',h.n);if(n&&n.trim()){h.n=n.trim();save()}break}
case'del':if(confirm('Delete this habit?')){S.habits=S.habits.filter(x=>x.id!=id);save()}break;
case'reset':if(confirm('Erase all LifeXP data?')){try{localStorage.removeItem(KEY)}catch(err){}location.reload();return}break;
}
render();
});
document.addEventListener('submit',e=>{
e.preventDefault();const f=e.target;const d=Object.fromEntries(new FormData(f));
if(f.id==='hf'&&d.n.trim()){S.habits.push({id:S.nextId++,n:d.n.trim(),c:d.c,f:d.f,r:d.r,g:(d.g||'').trim()});flash('New habit added 🌱')}
if(f.id==='nf'&&d.name.trim()){S.name=d.name.trim()}
save();render();
});
render();
</script>
</body>
</html>
